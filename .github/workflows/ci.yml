name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  server:
    name: Server validation
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/word-quest-ci
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci
      - name: Verify generated wordbooks
        run: npm run vocab:validate
      - name: Validate import dry-run
        run: npm run vocab:import:dry-run
      - name: Import wordbooks into MongoDB service
        run: npm run vocab:import
      - name: Verify MongoDB wordbook counts
        run: npm run vocab:verify-db
      - name: Static syntax check
        run: npm run check
      - name: P0 acceptance validation
        run: npm run test:p0
      - name: Production safety validation
        run: npm run test:security
      - name: Smoke test
        run: npm run test:smoke
      - name: Enterprise hard-requirement integration test
        run: npm run test:enterprise
      - name: Full-stack API E2E against MongoDB service
        run: npm run test:fullstack

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and enforce bundle budget
        run: npm run build:budget
      - name: Responsive readiness validation
        run: npm run test:responsive
      - name: Browser E2E validation
        run: PLAYWRIGHT_BROWSER_CHANNEL= npm run test:e2e

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [ server, client ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
      - name: Build runtime images
        run: docker compose build server client
