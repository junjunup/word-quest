<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Vue ECharts 直接测试</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.0/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-echarts@6.7.3/dist/index.umd.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a2e; color: #ddd; font-family: sans-serif; padding: 20px; }
    h1 { color: #ffd700; }
    .box { background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .box h4 { color: #b8b8d4; margin: 0 0 8px; }
    .chart { width: 100%; height: 280px; }
    .err { color: #f44; } .ok { color: #4f4; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Vue + ECharts 测试</h1>
    <p :class="error ? 'err' : 'ok'">{{ status }}</p>

    <div class="box"><h4>饼图</h4><v-chart :option="pieOpt" class="chart" autoresize></v-chart></div>
    <div class="box"><h4>折线图</h4><v-chart :option="lineOpt" class="chart" autoresize></v-chart></div>
    <div class="box"><h4>雷达图</h4><v-chart :option="radarOpt" class="chart" autoresize></v-chart></div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    const app = createApp({
      setup() {
        const status = ref('初始化中...');
        const error = ref(false);

        try {
          status.value = 'Vue ECharts 组件加载成功，正在渲染...';

          const pieOpt = ref({
            tooltip: { trigger: 'item' },
            color: ['#7ed321', '#4a90d9', '#666688'],
            series: [{
              type: 'pie', radius: ['40%', '70%'],
              label: { color: '#b8b8d4' },
              data: [
                { value: 10, name: '已掌握' },
                { value: 20, name: '学习中' },
                { value: 370, name: '未接触' }
              ]
            }]
          });

          const lineOpt = ref({
            tooltip: { trigger: 'axis' },
            grid: { left: 40, right: 20, top: 20, bottom: 30 },
            xAxis: { type: 'category', data: ['05-10', '05-11', '05-12', '05-13', '05-14'], axisLabel: { color: '#888' } },
            yAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#222' } } },
            series: [{ type: 'line', data: [3, 5, 2, 8, 4], smooth: true, lineStyle: { color: '#4a90d9' }, areaStyle: { color: 'rgba(74,144,217,0.1)' }, itemStyle: { color: '#4a90d9' } }]
          });

          const radarOpt = ref({
            radar: {
              indicator: [
                { name: 'Ch1 基础', max: 100 }, { name: 'Ch2 自然', max: 100 },
                { name: 'Ch3 商务', max: 100 }, { name: 'Ch4 学术', max: 100 },
                { name: 'Ch5 易混', max: 100 }, { name: 'Ch6 综合', max: 100 }
              ],
              axisName: { color: '#b8b8d4' }
            },
            series: [{
              type: 'radar',
              data: [{ value: [50, 30, 0, 0, 0, 0], name: '正确率', lineStyle: { color: '#4a90d9' }, areaStyle: { color: 'rgba(74,144,217,0.2)' } }]
            }]
          });

          setTimeout(() => { status.value = '三个图表均已渲染，请查看上方是否正常显示。'; }, 2000);

          return { status, error, pieOpt, lineOpt, radarOpt };
        } catch(e) {
          error.value = true;
          status.value = '渲染失败: ' + e.message;
          return { status, error, pieOpt: {}, lineOpt: {}, radarOpt: {} };
        }
      }
    });

    app.component('v-chart', VueECharts.default);
    app.mount('#app');
  </script>
</body>
</html>
